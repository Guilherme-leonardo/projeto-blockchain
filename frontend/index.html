<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registro de Pacientes</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.12.2/dist/web3.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin-top: 10px; }
        input, button { margin-top: 5px; padding: 5px; }
        .patient { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Cadastro de Pacientes</h2>
<form id="patientForm">
    <label>Nome:</label>
    <input type="text" id="nome" required>
    <label>CPF:</label>
    <input type="text" id="cpf" required>
    <label>Idade:</label>
    <input type="number" id="idade" required>
    <label>Endereço:</label>
    <input type="text" id="endereco" required>
    <button type="submit">Cadastrar Paciente</button>
</form>

<hr>

<h2>Consultar Paciente por CPF</h2>
<input type="text" id="cpfConsulta" placeholder="Digite CPF">
<button id="btnConsultar">Consultar</button>
<div id="consultaResultado"></div>

<hr>

<script>
let web3;
let contract;
let account;

// Inicializa Web3 e o contrato
async function init() {
    try {
        // Conecta com MetaMask se disponível, senão Ganache
        if (window.ethereum) {
            web3 = new Web3(window.ethereum);
            await window.ethereum.request({ method: 'eth_requestAccounts' });
        } else {
            web3 = new Web3(new Web3.providers.HttpProvider("http://127.0.0.1:7545"));
        }

        const accounts = await web3.eth.getAccounts();
        account = accounts[0];
        console.log("Conta conectada:", account);

        // Carrega JSON do contrato gerado pelo Truffle
        const response = await fetch('build/contracts/PatientRegistry.json');
        const PatientRegistryJSON = await response.json();

        // Pega network atual e endereço do contrato
        const networkId = await web3.eth.net.getId();
        const deployedNetwork = PatientRegistryJSON.networks[networkId];

        if (!deployedNetwork) {
            alert("Contrato não encontrado nesta rede!");
            return;
        }

        contract = new web3.eth.Contract(PatientRegistryJSON.abi, deployedNetwork.address);
        console.log("Contrato inicializado em:", deployedNetwork.address);

    } catch (err) {
        console.error("Erro ao inicializar Web3 ou contrato:", err);
        alert("Falha ao conectar com a blockchain.");
    }
}

// Cadastro de paciente
async function cadastrarPaciente(event) {
    event.preventDefault();
    if (!contract) { alert("Contrato não inicializado."); return; }

    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const idade = parseInt(document.getElementById("idade").value);
    const endereco = document.getElementById("endereco").value.trim();

    if (!nome || !cpf || !idade || !endereco) {
        alert("Preencha todos os campos corretamente.");
        return;
    }

    try {
        await contract.methods.registerPatient(nome, cpf, idade, endereco)
            .send({ from: account, gas: 3000000 });
        alert("Paciente cadastrado com sucesso!");
        document.getElementById("patientForm").reset();
    } catch (err) {
        console.error("Erro ao cadastrar paciente:", err);
        alert("Erro ao cadastrar paciente: " + err.message);
    }
}

// Consulta paciente
async function consultarPaciente() {
    if (!contract) { alert("Contrato não inicializado."); return; }

    const cpf = document.getElementById("cpfConsulta").value.trim();
    if (!cpf) { alert("Informe um CPF."); return; }

    try {
        const paciente = await contract.methods.getPatient(cpf).call();
        document.getElementById("consultaResultado").innerHTML =
            `<div class="patient">
                <strong>Nome:</strong> ${paciente[0]} <br>
                <strong>CPF:</strong> ${paciente[1]} <br>
                <strong>Idade:</strong> ${paciente[2]} <br>
                <strong>Endereço:</strong> ${paciente[3]}
            </div>`;
    } catch (err) {
        console.error("Erro ao consultar paciente:", err);
        document.getElementById("consultaResultado").innerHTML = "Paciente não encontrado.";
    }
}

// Eventos
window.addEventListener("load", init);
document.getElementById("patientForm").addEventListener("submit", cadastrarPaciente);
document.getElementById("btnConsultar").addEventListener("click", consultarPaciente);
</script>

</body>
</html>
